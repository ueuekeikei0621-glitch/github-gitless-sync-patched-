name: Release plugin

on:
  push:
    tags:
      - "[0-9].[0-9]+.[0-9]+*"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          git clone --quiet --depth 1 --branch "$TAG" "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" plugin
          cd plugin
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm build
          if [[ "$TAG" == *-beta* ]]; then prerelease=--prerelease; else prerelease=; fi
          gh release create "$TAG" --title "$TAG" $prerelease main.js manifest.json styles.css
