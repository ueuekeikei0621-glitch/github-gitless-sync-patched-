name: Release plugin

# Publishes a release whenever manifest.json carries a version that has no
# release yet: bump the version in manifest.json, manifest-beta.json and
# versions.json, and push.
on:
  push:
    branches: [main]
    paths:
      - manifest.json
      - .github/workflows/release.yml
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Build and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init --quiet plugin
          cd plugin
          git fetch --quiet --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$GITHUB_SHA"
          git checkout --quiet FETCH_HEAD
          version=$(node -p 'require("./manifest.json").version')
          if gh release view "$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "Release $version already exists"
            exit 0
          fi
          npm install -g pnpm@10
          pnpm install --frozen-lockfile
          pnpm build
          case "$version" in *-beta*) prerelease=--prerelease ;; *) prerelease= ;; esac
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version" $prerelease main.js manifest.json styles.css
